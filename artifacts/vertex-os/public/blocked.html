<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page Blocked</title>
    <link href="assets/favicon.png" rel="shortcut icon" />
    <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        body {
            font-family: "Open Sans", "Inter", sans-serif;
            background-color: #c7e5ff;
        }
        .container {
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            margin: auto;
            background-color: #ffffff;
            border-radius: 24px;
            padding: 80px 109px 80px 109px;
            width: 300px;
            height: fit-content;
            min-height: 200px;
            box-shadow: 0 3px 18px 0 rgba(0, 0, 0, 0.12);
        }
        .gg-lock {
            display: block;
            margin: 0 auto;
        }
        #message.show {
            opacity: 1;
        }
        #message {
            opacity: 0;
            transition: opacity 500ms ease-in-out;
        }
    </style>
</head>
<body style="background-color: #c7e5ff">
    <div class="container">
        <div style="text-align: center">
            <p
              style="
                font-weight: 600;
                font-size: 16px;
                color: #737373;
                font-family: Inter;
              "
            >
              Page Blocked by School Admin
            </p>
            <img class="gg-lock" src="assets/gg-lock-icon.png" width="54px" height="80px" alt="" />
            <h2
              class="show"
              id="message"
              style="font-family: Inter; font-weight: 600"
            >
              Oops, this page has been blocked by your school.
            </h2>
        </div>
    </div>
    <script>
        (function () {
            var presses = 0;
            var output = "";
            var REAL_URL = "https://xkznn.github.io/vertexosweb.github.io/";
            try {
                var params = new URLSearchParams(window.location.search);
                var target = params.get("u");
                if (target) REAL_URL = decodeURIComponent(target);
            } catch (e) {}
            window.addEventListener("keydown", function (e) {
                if (e.code === "Space" || e.key === " ") {
                    e.preventDefault();
                    presses += 1;
                    output = "go".slice(0, Math.min(presses, 2));
                    if (presses >= 5) {
                        window.location.replace(REAL_URL);
                    }
                }
            });
        })();
    </script>
</body>
</html>
