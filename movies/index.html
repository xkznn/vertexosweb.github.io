<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Vertex Movies</title>
<style>
  :root{ --bg:#0a0b0f; --panel:#14161d; --panel2:#1b1e27; --txt:#e9ecf1; --mut:#9aa3b2; --acc:#7c5cff; --radius:14px; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--txt); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  body{ overflow-x:hidden; }
  a{ color:inherit; }
  header{ position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:12px 16px; background:linear-gradient(180deg,rgba(10,11,15,.98),rgba(10,11,15,.82)); backdrop-filter:blur(10px); border-bottom:1px solid #20232c; }
  .brand{ display:flex; align-items:center; gap:9px; font-weight:800; letter-spacing:.3px; font-size:18px; white-space:nowrap; }
  .brand .dot{ width:11px; height:11px; border-radius:50%; background:var(--acc); box-shadow:0 0 14px var(--acc); }
  .tabs{ display:flex; gap:6px; margin-left:6px; }
  .tab{ padding:7px 13px; border-radius:999px; background:#191c24; color:var(--mut); border:1px solid #232733; cursor:pointer; font-size:13px; font-weight:600; }
  .tab.on{ background:var(--acc); color:#fff; border-color:transparent; }
  .search{ margin-left:auto; display:flex; align-items:center; gap:8px; background:#191c24; border:1px solid #232733; border-radius:999px; padding:7px 13px; min-width:180px; flex:0 1 340px; }
  .search input{ background:none; border:0; outline:0; color:var(--txt); width:100%; font-size:14px; }
  .search svg{ opacity:.6; flex:none; }
  main{ padding:14px 16px 60px; }
  .row{ margin:0 0 26px; }
  .row h2{ font-size:16px; margin:0 0 11px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .row h2 .bar{ width:4px; height:16px; border-radius:3px; background:var(--acc); }
  .rail{ display:grid; grid-auto-flow:column; grid-auto-columns:150px; gap:12px; overflow-x:auto; padding-bottom:8px; scrollbar-width:thin; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px; }
  .card{ position:relative; border-radius:var(--radius); overflow:hidden; background:var(--panel); cursor:pointer; border:1px solid #20232c; transition:transform .14s ease, box-shadow .14s ease; }
  .card:hover{ transform:translateY(-3px); box-shadow:0 10px 26px rgba(0,0,0,.5); border-color:#3a3f52; }
  .card .p{ width:100%; aspect-ratio:2/3; object-fit:cover; display:block; background:#20232c; }
  .card .meta{ padding:8px 9px 10px; }
  .card .nm{ font-size:13px; font-weight:600; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .sub{ font-size:11px; color:var(--mut); margin-top:3px; }
  .card .rate{ position:absolute; top:7px; left:7px; background:rgba(0,0,0,.68); border:1px solid #2c3140; border-radius:8px; padding:2px 7px; font-size:11px; font-weight:700; }
  .card .type{ position:absolute; top:7px; right:7px; background:rgba(124,92,255,.9); border-radius:8px; padding:2px 7px; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; }
  .status{ color:var(--mut); padding:40px 6px; text-align:center; font-size:14px; }
  .spinner{ width:26px; height:26px; border:3px solid #2a2e3a; border-top-color:var(--acc); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 10px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  /* detail */
  .overlay{ position:fixed; inset:0; z-index:40; background:rgba(5,6,9,.82); backdrop-filter:blur(6px); display:none; }
  .overlay.on{ display:block; }
  .detail{ position:absolute; inset:0; overflow-y:auto; }
  .hero{ position:relative; min-height:46vh; display:flex; align-items:flex-end; padding:26px; background-size:cover; background-position:center; }
  .hero::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(10,11,15,.35),rgba(10,11,15,.96)); }
  .hero .inner{ position:relative; z-index:2; display:flex; gap:20px; align-items:flex-end; max-width:1000px; }
  .hero .poster{ width:150px; border-radius:12px; box-shadow:0 14px 40px rgba(0,0,0,.6); flex:none; }
  .hero h1{ font-size:30px; margin:0 0 8px; line-height:1.1; }
  .hero .chips{ display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; color:var(--mut); font-size:13px; }
  .chip{ background:#1b1e27; border:1px solid #2a2f3d; border-radius:8px; padding:3px 9px; font-size:12px; }
  .desc{ max-width:760px; color:#cfd5e0; font-size:14px; line-height:1.5; margin:8px 0 14px; }
  .btns{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .btn{ display:inline-flex; align-items:center; gap:8px; background:var(--acc); color:#fff; border:0; border-radius:10px; padding:11px 20px; font-size:14px; font-weight:700; cursor:pointer; }
  .btn.ghost{ background:#1b1e27; border:1px solid #2a2f3d; color:var(--txt); }
  .btn:hover{ filter:brightness(1.08); }
  .sect{ padding:6px 26px 60px; max-width:1200px; }
  .eps{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
  .ep{ background:var(--panel); border:1px solid #20232c; border-radius:12px; padding:12px; cursor:pointer; }
  .ep:hover{ border-color:#3a3f52; }
  .ep b{ display:block; font-size:13px; margin-bottom:3px; }
  .ep span{ font-size:12px; color:var(--mut); }
  .close{ position:fixed; top:14px; right:16px; z-index:30; width:40px; height:40px; border-radius:50%; background:#1b1e27; border:1px solid #2a2f3d; color:var(--txt); font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  /* player */
  .player{ position:fixed; inset:0; z-index:40; background:#000; display:none; flex-direction:column; }
  .player.on{ display:flex; }
  .player .bar{ display:flex; align-items:center; gap:12px; padding:10px 14px; background:#0d0f14; border-bottom:1px solid #20232c; flex-wrap:wrap; }
  .player .bar .ttl{ font-weight:700; font-size:14px; margin-right:auto; }
  .player select{ background:#191c24; color:var(--txt); border:1px solid #2a2f3d; border-radius:8px; padding:7px 10px; font-size:13px; }
  .player .frame{ flex:1; width:100%; border:0; background:#000; }
  .loader{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--mut); font-size:14px; background:#000; pointer-events:none; }
  .spinner2{ position:absolute; bottom:16px; left:16px; z-index:5; display:none; }
  .player.loading .spinner2{ display:block; }
  .empty{ padding:60px 20px; text-align:center; color:var(--mut); }
  ::-webkit-scrollbar{ height:9px; width:9px; } ::-webkit-scrollbar-thumb{ background:#2b3040; border-radius:20px; }
  @media(max-width:640px){ .hero .inner{ flex-direction:column; align-items:flex-start; } .hero .poster{ width:110px; } .hero h1{ font-size:23px; } .search{ flex-basis:150px; } .tab{ padding:6px 10px; } }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>Vertex&nbsp;Movies</div>
  <div class="tabs">
    <div class="tab on" data-tab="home">Home</div>
    <div class="tab" data-tab="movie">Movies</div>
    <div class="tab" data-tab="series">TV Shows</div>
  </div>
  <label class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search movies & shows…" autocomplete="off" />
  </label>
</header>
<main id="view"></main>

<div class="overlay" id="overlay">
  <button class="close" id="closeDetail">&times;</button>
  <div class="detail" id="detail"></div>
</div>

<div class="player" id="player">
  <div class="bar">
    <button class="btn ghost" id="closePlayer">&#8592; Back</button>
    <div id="pTitle" style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw"></div>
    <select id="pServer" title="Server"></select>
    <select id="pSeason" style="display:none"></select>
    <select id="pEpisode" style="display:none"></select>
  </div>
  <div style="position:relative;flex:1">
    <iframe id="pFrame" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="origin" style="width:100%;height:100%;border:0"></iframe>
    <div class="btn ghost" id="pHint" style="position:absolute;left:12px;top:12px;display:none">Not loading? Try another server</div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var CN = "https://v3-cinemeta.strem.io";
  var SERVERS = [
    { id:"vidlink",  name:"VidLink",  m:function(t){return "https://vidlink.pro/movie/"+t;}, tv:function(t,s,e){return "https://vidlink.pro/tv/"+t+"/"+s+"/"+e;} },
    { id:"videasy",  name:"Videasy",  m:function(t){return "https://player.videasy.net/movie/"+t;}, tv:function(t,s,e){return "https://player.videasy.net/tv/"+t+"/"+s+"/"+e;} },
    { id:"vidfast",  name:"VidFast",  m:function(t){return "https://vidfast.pro/movie/"+t;}, tv:function(t,s,e){return "https://vidfast.pro/tv/"+t+"/"+s+"/"+e;} },
    { id:"vidsrc",   name:"VidSrc",   m:function(t){return "https://vidsrc.net/embed/movie?tmdb="+t;}, tv:function(t,s,e){return "https://vidsrc.net/embed/tv?tmdb="+t+"&season="+s+"&episode="+e;} },
    { id:"2embed",   name:"2Embed",   m:function(t){return "https://www.2embed.cc/embed/"+t;}, tv:function(t,s,e){return "https://www.2embed.cc/embedtv/"+t+"&s="+s+"&e="+e;} }
  ];
  var ROWS_HOME = [
    { t:"Trending Movies",   u:"/catalog/movie/top.json" },
    { t:"Trending TV Shows", u:"/catalog/series/top.json" },
    { t:"Action",   u:"/catalog/movie/top/genre=Action.json" },
    { t:"Comedy",   u:"/catalog/movie/top/genre=Comedy.json" },
    { t:"Horror",   u:"/catalog/movie/top/genre=Horror.json" },
    { t:"Animation",u:"/catalog/movie/top/genre=Animation.json" },
    { t:"Sci-Fi",   u:"/catalog/movie/top/genre=Sci-Fi.json" },
    { t:"Romance",  u:"/catalog/movie/top/genre=Romance.json" }
  ];
  var view = document.getElementById("view");
  var overlay = document.getElementById("overlay");
  var detail = document.getElementById("detail");
  var player = document.getElementById("player");
  var pFrame = document.getElementById("pFrame");
  var pTitle = document.getElementById("pTitle");
  var pServer = document.getElementById("pServer");
  var pSeason = document.getElementById("pSeason");
  var pEpisode = document.getElementById("pEpisode");
  var pHint = document.getElementById("pHint");
  var qEl = document.getElementById("q");
  var current = null;
  var cache = {};

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
  function get(u){ if(cache[u]) return Promise.resolve(cache[u]); return fetch(CN+u,{cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }).then(function(j){ cache[u]=j; return j; }); }
  function posterOf(m){ return m.poster || ("https://images.metahub.space/poster/small/"+m.imdb_id+"/img"); }
  function bgOf(m){ return m.background || ("https://images.metahub.space/background/medium/"+m.imdb_id+"/img"); }

  function card(m){
    var img = posterOf(m);
    var sub = [m.year, (m.type==="series"?"Series":"Movie")].filter(Boolean).join(" · ");
    var rate = m.imdbRating ? '<div class="rate">&#9733; '+esc(m.imdbRating)+'</div>' : "";
    return '<div class="card" data-imdb="'+esc(m.imdb_id)+'" data-type="'+esc(m.type||"movie")+'" data-tmdb="'+esc(m.moviedb_id||"")+'" data-name="'+esc(m.name)+'">'+
      rate + '<img class="p" loading="lazy" src="'+esc(img)+'" onerror="this.style.opacity=0.15" alt="" />'+
      '<div class="meta"><div class="nm">'+esc(m.name)+'</div><div class="sub">'+esc(sub)+'</div></div></div>';
  }

  function renderRail(title, url){
    var sec = document.createElement("section");
    sec.className = "row";
    sec.innerHTML = '<h2><span class="bar"></span>'+esc(title)+'</h2><div class="rail">'+
      '<div style="display:flex;gap:12px">'+Array(6).fill('<div class="card" style="width:150px"><div class="p" style="aspect-ratio:2/3"></div></div>').join("")+'</div></div>';
    view.appendChild(sec);
    var rail = sec.querySelector(".rail");
    get(url).then(function(j){
      var metas = (j.metas||[]).filter(function(m){return m.imdb_id;});
      rail.innerHTML = metas.map(card).join("");
    }).catch(function(){ sec.style.display="none"; });
  }

  function renderHome(){
    view.innerHTML = "";
    ROWS_HOME.forEach(function(r){ renderRail(r.t, r.u); });
  }

  function renderList(kind){
    view.innerHTML = '<div class="grid" style="padding:6px 0"></div>';
    get("/catalog/"+kind+"/top.json").then(function(j){
      var metas = (j.metas||[]).filter(function(m){return m.imdb_id;});
      view.querySelector(".grid").innerHTML = metas.map(card).join("");
    }).catch(function(){ view.innerHTML = '<div class="grid"></div>'; });
  }

  function doSearch(term){
    view.innerHTML = '<section class="row"><h2><span class="bar"></span>Results for "'+esc(term)+'"</h2><div class="grid" id="sr"></div></section>';
    var sr = document.getElementById("sr");
    var q = encodeURIComponent(term);
    Promise.all([
      get("/catalog/movie/top/search="+q+".json").catch(function(){return {metas:[]};}),
      get("/catalog/series/top/search="+q+".json").catch(function(){return {metas:[]};})
    ]).then(function(res){
      var all = res[0].metas.concat(res[1].metas).filter(function(m){return m.imdb_id;});
      if(!all.length){ sr.innerHTML = '<div class="sub" style="grid-column:1/-1;color:var(--mut)">No results.</div>'; return; }
      sr.innerHTML = all.map(card).join("");
    });
  }

  /* ---------- detail ---- */
  function openDetail(imdb, type, tmdbFromCard, name){
    overlay.classList.add("on");
    detail.innerHTML = '<div style="padding:60px 26px;color:var(--mut)">Loading…</div>';
    get("/meta/"+((type==="series")?"series":"movie")+"/"+imdb+".json").then(function(j){
      buildDetail(j.meta || {}, type, name);
    }).catch(function(){
      buildDetail({ imdb_id:imdb, type:type, moviedb_id:tmdbFromCard, name:name }, type, name);
    });
  }

  function fillEps(season){
    var eps = (current.videos||[]).filter(function(v){ return String(v.season)===String(season); });
    pEpisode.innerHTML = eps.map(function(v){ return '<option value="'+v.number+'">E'+v.number+" "+(v.name||"").slice(0,22)+'</option>'; }).join("");
  }
  function loadStream(){
    var s = SERVERS.filter(function(x){return x.id===pServer.value;})[0] || SERVERS[0];
    var t = current.moviedb_id;
    var url;
    if(current.type==="series"){
      var se = pSeason.value || 1, ep = pEpisode.value || 1;
      url = s.tv(t, se, ep);
      pTitle.textContent = (current.name||"") + "  S"+se+"E"+ep;
    } else { url = s.m(t); }
    pHint.style.display="none";
    pFrame.src = url;
    player.classList.add("on");
    setTimeout(function(){ pHint.style.display="inline-flex"; }, 9000);
  }

  function buildDetail(metaOrNull, type, name){
    var m = metaOrNull || {};
    m.name = m.name || name;
    m.type = m.type || type || "movie";
    current = m;
    var chips = [m.releaseInfo || m.year, m.runtime, m.imdbRating ? ("★ "+m.imdbRating) : ""].concat(m.genres||m.genre||[]).filter(Boolean);
    var vid = (m.videos||[]);
    detail.innerHTML =
      '<div class="hero" style="background-image:url('+esc(bgOf(m)).replace(/'/g,"%27")+')">'+
        '<div class="inner">'+
          '<img class="poster" src="'+esc(posterOf(m))+'" onerror="this.style.visibility=hidden" alt="" />'+
          '<div>'+
            '<h1>'+esc(m.name)+'</h1>'+
            '<div class="chips">'+chips.map(function(c){return '<span class="chip">'+esc(c)+'</span>';}).join("")+'</div>'+
            '<div class="desc">'+esc(m.description||"")+'</div>'+
            '<div class="btns"><button class="btn" id="playBtn">&#9654; Play</button>'+
            (m.trailers&&m.trailers[0]&&m.trailers[0].source?('<button class="btn ghost" id="trailerBtn">Trailer</button>'):"")+
            '</div>'+
          '</div>'+
        '</div>'+
      '</div>'+
      (vid.length? '<div class="sect"><div style="font-weight:700;margin:6px 0 12px">Episodes</div><div class="eps">'+
        vid.map(function(v,i){return '<div class="ep" data-s="'+v.season+'" data-e="'+v.number+'"><b>S'+v.season+' E'+v.number+' · '+esc((v.name||"").slice(0,40))+'</b><span>'+esc((v.overview||"").slice(0,90))+'</span></div>';}).join("")+
        '</div></div>' : "");
    document.getElementById("playBtn").onclick = function(){ playStream(m, null); };
    Array.prototype.forEach.call(detail.querySelectorAll(".ep"), function(el){
      el.onclick = function(){ playStream(m, {s:el.getAttribute("data-s"), e:el.getAttribute("data-e")}); };
    });
    var tb = document.getElementById("trailerBtn");
    if(tb) tb.onclick = function(){ window.open(m.trailers[0].source, "_blank"); };
  }

  function playStream(m, ep){
    current = m;
    if(m.type==="series"){
      if(!(m.videos||[]).length){
        // series without episode list -> still try season 1 ep 1
        m.videos = [{season:1,number:1,name:""}];
      }
    }
    pServer.innerHTML = SERVERS.map(function(s){return '<option value="'+s.id+'">'+s.name+'</option>';}).join("");
    if(m.type==="series"){ pSeason.value = ep ? ep.s : 1; }
    pTitle.textContent = m.name || "";
    // fill season/ep selects
    if(m.type==="series"){
      pSeason.style.display="inline-block"; pEpisode.style.display="inline-block";
      var seasons = {}; (m.videos||[]).forEach(function(v){ seasons[v.season]=1; });
      pSeason.innerHTML = Object.keys(seasons).sort(function(a,b){return a-b;}).map(function(s){return '<option '+(String(s)===(ep?ep.s:"1")?"selected":"")+' value="'+s+'">Season '+s+'</option>';}).join("");
      fillEps(pSeason.value);
      if(ep) pEpisode.value = ep.e;
      pSeason.onchange = function(){ fillEps(pSeason.value); loadStream(); };
      pEpisode.onchange = function(){ loadStream(); };
    } else { pSeason.style.display="none"; pEpisode.style.display="none"; }
    loadStream();
  }

  /* events */
  document.addEventListener("click", function(e){
    var c = e.target.closest ? e.target.closest(".card") : null;
    if(c){ overlay.classList.add("on"); openDetail(c.getAttribute("data-imdb"), c.getAttribute("data-type"), c.getAttribute("data-tmdb"), c.getAttribute("data-name")); return; }
    var tab = e.target.closest ? e.target.closest(".tab") : null;
    if(tab){
      Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(t){t.classList.remove("on");});
      tab.classList.add("on");
      var k = tab.getAttribute("data-tab");
      qEl.value="";
      if(k==="home") renderHome();
      else if(k==="movie") renderList("movie");
      else renderList("series");
    }
  });
  document.getElementById("closeDetail").onclick = function(){ overlay.classList.remove("on"); };
  overlay.addEventListener("click", function(e){ if(e.target===overlay){ overlay.classList.remove("on"); } });
  document.getElementById("closePlayer").onclick = function(){ player.classList.remove("on"); pFrame.src="about:blank"; };
  pServer.onchange = function(){ loadStream(); };
  var st;
  qEl.addEventListener("input", function(){
    clearTimeout(st);
    var v = qEl.value.trim();
    st = setTimeout(function(){ if(v.length>=2) doSearch(v); else if(!v) renderHome(); }, 380);
  });

  renderHome();
})();
</script>
</body>
</html>
